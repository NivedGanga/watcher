name: npm-release

# Build platform binaries with PyInstaller and publish snitch-tool-* + the
# `snitch-tool` launcher package. Trigger by pushing a tag like `npm-v0.1.0`
# or running the workflow manually. Requires the NPM_TOKEN repo secret.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true
  push:
    tags: ["npm-v*"]

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,       target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: ubuntu-latest,  target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-latest, target: win32-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build binary
        if: runner.os != 'Windows'
        run: bash npm/build.sh
      - name: Build Windows binary
        if: runner.os == 'Windows'
        run: ./npm/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: npm/platforms/${{ matrix.target }}/bin/
          if-no-files-found: error

  publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#npm-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*

      - name: Place binaries
        run: |
          for d in bin-*; do
            t="${d#bin-}"
            mkdir -p "npm/platforms/$t/bin"
            cp "$d"/snitch* "npm/platforms/$t/bin/"
            if [ "$t" != "win32-x64" ]; then
              chmod +x "npm/platforms/$t/bin/snitch"
            fi
          done

      - name: Stamp versions
        env:
          RELEASE_VERSION: ${{ steps.v.outputs.version }}
        run: |
          for p in npm/platforms/*/package.json npm/snitch/package.json; do
            npm version "$RELEASE_VERSION" --no-git-tag-version \
              --prefix "$(dirname "$p")" --allow-same-version
          done
          for t in npm/platforms/*; do
            npm pkg set "optionalDependencies.snitch-tool-${t##*/}=$RELEASE_VERSION" --prefix npm/snitch
          done

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in npm/platforms/*/; do
            npm publish "$p" --access public --provenance
          done

      - name: Publish launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm/snitch --access public --provenance
