# Build and publish the agentwatch CLI to PyPI via trusted publishing
# (OIDC — no stored tokens or secrets). Trigger: push a tag like
# `cli-v0.1.0`. Configure the trusted publisher on PyPI with this repo,
# this workflow file, and environment `pypi`.

name: cli-release

on:
  push:
    tags:
      - "cli-v*.*.*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        working-directory: cli
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#cli-v}"
          VER=$(python -c "import tomllib;print(tomllib.load(open('cli/pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$VER" || { echo "tag cli-v$TAG != pyproject version $VER"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cli/dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentwatch
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
